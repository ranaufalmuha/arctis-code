[package]
name = "arctis-code"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ArctisCode — lightweight native Rust code editor (egui + Neovim)"
authors = ["Arctis"]
license = "MIT"
default-run = "ArctisCode"

[[bin]]
name = "ArctisCode"
path = "src/main.rs"

[[bin]]
name = "arctis-host"
path = "src/bin/arctis-host.rs"

[lib]
name = "arctis_code"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.32", features = ["default_fonts"] }
egui = "0.32"
walkdir = "2.5"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.48", default-features = false, features = ["text"] }
anyhow = "1.0"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["process", "rt", "rt-multi-thread", "macros", "io-util", "time"] }
nvim-rs = { version = "0.9", features = ["tokio", "use_tokio"] }
rfd = "0.15"
dirs = "6"
open = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
